name: check

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Node syntax check
        run: node --check lib/index.js && node --check lib/client.js
      - name: Validate package.json
        run: node -e "const p=JSON.parse(require('fs').readFileSync('package.json','utf8')); if(!p.name||!p.version) throw new Error('name/version missing'); console.log('package.json OK')"
